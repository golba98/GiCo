[package]
name = "gico"
version = "0.2.0"
edition = "2021"
description = "GiCo - context-aware local AI terminal assistant for small local models"
license = "MIT AND Apache-2.0"
repository = "https://github.com/golba98/GiCo"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
strsim = "0.11"
toml = "0.9"
tempfile = "3"
crossterm = "0.29"
libc = "0.2"
shlex = "1.3"  # same crate+pin codex-rs/shell-command uses for POSIX word splitting
unicode-segmentation = "1.13"
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
portable-pty = "0.9"

[[bin]]
name = "gico"
path = "src/main.rs"

[[bin]]
name = "gico-bench"
path = "src/bin/gico-bench.rs"

[profile.release]
opt-level = 2
